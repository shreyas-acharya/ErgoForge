# Core Features
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# The Core Fix for Seeed Studio Xiao Matrix Crashes
CONFIG_NFCT_PINS_AS_GPIOS=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000
CONFIG_ZMK_STUDIO=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_BAS=n

# --- NOISE FILTERING & LOW POWER OPTIMIZATIONS ---
# Slow down the scanning matrix checks when no keys are pressed to filter out trace noise
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Split and Connection Stability Flags
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

